<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Character</title>

    <link rel="icon" href="354df8db-871f-4562-907a-10701cab08e6.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <p class="small-title">DAILY SYSTEM</p>

            <h1>CHARACTER CHECKLIST</h1>

            <p id="date"></p>

            <div class="score-box">
                <span id="score">0</span>
                <span>/ 24</span>
            </div>
        </header>


        <section class="card">

            <h2> MINDSET</h2>

            <label>
                <input type="checkbox" class="check">
                <span>دنبال تأیید دیگران نبودم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>خودم را با دیگران مقایسه نکردم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>حرف مردم پشت سرم را جدی نگرفتم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>همه چیز را برای همه تعریف نکردم</span>
            </label>

        </section>


        <section class="card">

            <h2> BEHAVIOR</h2>

            <label>
                <input type="checkbox" class="check">
                <span>کمتر و حساب‌شده‌تر حرف زدم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>بیشتر گوش دادم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>بی‌دلیل فحش ندادم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>شوخی‌هایم برای جلب توجه نبود</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>در جمع آرام و کنترل‌شده بودم</span>
            </label>

        </section>


        <section class="card">

            <h2> SELF-CONTROL</h2>

            <label>
                <input type="checkbox" class="check">
                <span>قبل از واکنش عصبی مکث کردم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>احساساتم تصمیم‌هایم را کنترل نکردند</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>لازم نبود هر احساسی را نشان بدهم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>وقتی تحریک شدم، خودم را کنترل کردم</span>
            </label>

        </section>


        <section class="card">

            <h2> DISCIPLINE</h2>

            <label>
                <input type="checkbox" class="check">
                <span>کار سخت امروز را انجام دادم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>حتی وقتی حوصله نداشتم، کار مهمم را انجام دادم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>کار مهمم را قبل از سرگرمی انجام دادم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>به قولی که به خودم داده بودم عمل کردم</span>
            </label>

        </section>


        <section class="card">

            <h2> GROWTH</h2>

            <label>
                <input type="checkbox" class="check">
                <span>برای آینده‌ام کاری انجام دادم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>روی مهارت یا درآمدم کار کردم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>امروز به‌جای مقایسه، روی پیشرفت خودم تمرکز کردم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>از رقابت برای بهتر شدن استفاده کردم</span>
            </label>

        </section>


        <section class="card">

            <h2> PRESENCE</h2>

            <label>
                <input type="checkbox" class="check">
                <span>اعتمادبه‌نفسم را به تأیید دیگران وابسته نکردم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>اطلاعات غیرضروری درباره خودم فاش نکردم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>محترم بودم، بدون اینکه نیاز به جلب رضایت همه داشته باشم</span>
            </label>

            <label>
                <input type="checkbox" class="check">
                <span>آرام، جدی و باوقار رفتار کردم</span>
            </label>

        </section>


        <section class="card review"
        dir="ltr">

            <h2>🌙 NIGHT REVIEW</h2>

            <label>One thing I did well:</label>
            <textarea id="good"></textarea>


            <label>One thing I need to improve tomorrow:</label>
            <textarea id="improve"></textarea>


            <label>Tomorrow's main mission:</label>
            <textarea id="mission"></textarea>

        </section>


        <footer>

            <p>CALM. QUIET. DISCIPLINED. CONFIDENT. PRIVATE.</p>

            <strong>DISCIPLINE &gt; MOOD</strong>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
